name: Project 18 - GitOps Infra Deployment
 
on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - 'Project_18/**'
      - '.github/workflows/project18-gitops-deploy.yml'
 
jobs:
  terraform-plan:
    name: Terraform Plan (Pre-Approval Check)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Project_18
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
 
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
 
      - name: Terraform Init & Validate
        run: |
          terraform init
          terraform validate
 
      - name: Terraform Plan
        run: terraform plan -out=tfplan
 
  terraform-apply:
    name: Terraform Apply (Production Approval Required)
    needs: terraform-plan
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: production-approval
    defaults:
      run:
        working-directory: Project_18
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
 
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
 
      - name: Terraform Init & Apply
        run: |
          terraform init
          terraform apply -auto-approve
